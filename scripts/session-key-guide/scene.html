<div id="caption"><h2 id="step-title"></h2><p id="step-text"></p></div><div id="timeline"></div>
<script>
const cameras=[[0,0,1100,560],[305,75,795,405],[300,205,530,270],[550,130,550,280],[550,130,550,420],[0,0,1100,560]];
const targets=[[650,300,170,112],[639,92,130,36],[320,316,236,62],[566,220,194,33],[766,220,231,33],[210,245,690,126]];
const cursors=[[736,354],[708,111],[450,359],[806,158],[877,238],[410,303]];
const byId=id=>document.getElementById(id),ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),4);
window.draw=(time,steps)=>{
 const index=Math.max(0,steps.findIndex(s=>time>=s.start&&time<s.end)),step=steps[index],local=time-step.start;
 const progress=ease(local/.85),previous=Math.max(0,index-1);
 const camera=cameras[index].map((n,i)=>cameras[previous][i]+(n-cameras[previous][i])*progress);
 byId('scene').setAttribute('viewBox',camera.join(' '));
 byId('step-title').textContent=`${index+1} / ${steps.length}  ${step.title}`;byId('step-text').textContent=step.text;
 byId('tools').style.opacity=index===0&&local<2.6?'0':'1';byId('f12').style.opacity=index===0&&local<2.6?'1':'0';byId('return-form').style.opacity=index===5?'1':'0';
 byId('claude-screen').setAttribute('transform',`translate(${index===0?340:0} 0)`);
 const applicationSelected=index>=2||(index===1&&local>=1.15);
 byId('application-active').style.opacity=applicationSelected?'1':'0';
 byId('application-panel').style.opacity=applicationSelected?'1':'0';
 byId('elements-active').style.opacity=applicationSelected?'0':'1';
 byId('elements-panel').style.opacity=applicationSelected?'0':'1';byId('origin-active').style.opacity=index>=2?'1':'0';
 byId('filter').textContent=index>=3?'sessionKey'.slice(0,Math.min(10,Math.floor(local*12))):'Filter';
 byId('rows').setAttribute('transform',`translate(0 ${index>=3?-66:0})`);byId('unfiltered').style.opacity=index>=3?'0':'1';
 byId('selected-row').style.opacity=index>=3?'1':'0';byId('edit-selection').style.opacity=index===4&&local>.7?'1':'0';byId('value').setAttribute('fill',index===4&&local>.7?'#fff':'#263e5b');
 byId('copy-keys').style.opacity=index===4?'1':'0';byId('address').textContent=index===5?'gettoken.cc/verify/':'claude.ai/new';
 byId('tab-label').textContent=index===5?'GetToken':'Claude';
 byId('pasted').textContent=index===5&&local>1?'sk-ant-sid02-EXAMPLE_ONLY'.slice(0,Math.floor((local-1)*24)):'';
 const focus=byId('focus');['x','y','width','height'].forEach((name,i)=>focus.setAttribute(name,targets[index][i]));focus.style.opacity=String(.75+.25*Math.sin(time*4));
 let cursor=cursors[index].map((n,i)=>cursors[previous][i]+(n-cursors[previous][i])*progress);
 if(index===3&&local>2){const selection=ease((local-2)/.8);cursor=cursor.map((n,i)=>n+([663,236][i]-n)*selection);}
 byId('cursor').setAttribute('transform',`translate(${cursor.join(' ')})`);
 byId('click-ring').style.opacity=local>.85&&local<1.4?String(1-(local-.85)/.55):'0';
 byId('timeline').innerHTML=steps.map((s,i)=>`<i><b style="width:${i<index?100:i===index?Math.min(100,local/(s.end-s.start)*100):0}%"></b></i>`).join('');
};
</script></body></html>
