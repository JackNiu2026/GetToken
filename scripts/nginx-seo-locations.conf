# Managed by GetToken SEO deployment. Only SEO URL aliases are affected.
# The retired /navigation/ hub moved to /guides/; keep query strings for analytics.
location = /navigation {
    absolute_redirect off;
    return 301 /guides/$is_args$args;
}
location ^~ /navigation/ {
    absolute_redirect off;
    return 301 /guides/$is_args$args;
}
# Product and guide pages are directories: add the trailing slash and hide index.html.
location = /verify/ {
    error_page 418 = @gettoken_private_verify;
    # Cover percent-encoded query keys too. Only the clean introduction URL is
    # indexable; parameterized state shells never need search indexing.
    if ($is_args) {
        return 418;
    }
    add_header Cache-Control "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files /verify/index.html =404;
}
location @gettoken_private_verify {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files /verify/index.html =404;
}
location = /verify/admin/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    try_files /verify/admin/index.html =404;
}
location ~ ^/((?:guides|verify|codex|claude|gemini|grok|ip)(?:/[a-z0-9-]+)*)$ {
    absolute_redirect off;
    return 301 /$1/$is_args$args;
}
location ~ ^/((?:guides|verify|codex|claude|gemini|grok|ip)(?:/[a-z0-9-]+)*)/index\.html$ {
    absolute_redirect off;
    # Directory index processing must keep serving content internally.
    if ($request_uri ~ "^/((?:guides|verify|codex|claude|gemini|grok|ip)(?:/[a-z0-9-]+)*)/index\.html(?:\?.*)?$") {
        return 301 /$1/$is_args$args;
    }
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
# /verify/ talks to the local review service (gettoken-verify.service, 127.0.0.1 only).
location ^~ /api/verify/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 64k;
}
