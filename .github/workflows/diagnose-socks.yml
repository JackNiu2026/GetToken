name: Diagnose authorized SOCKS5 subscription
on:
  workflow_dispatch:
    inputs:
      subscription_hash:
        description: SHA-256 of the explicitly authorized subscription access token
        required: true
        type: string
      proxy_host:
        description: Expected IPv4 address of the authorized proxy
        required: true
        type: string
      proxy_port:
        description: Expected proxy port
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gettoken-production
      cancel-in-progress: false
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read-only diagnosis of the authorized subscription
        env:
          DEPLOY_HOST: ${{ vars.GETTOKEN_HOST || '39.97.40.89' }}
          DEPLOY_USER: ${{ vars.GETTOKEN_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.GETTOKEN_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.GETTOKEN_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GETTOKEN_KNOWN_HOSTS }}
          SUBSCRIPTION_HASH: ${{ inputs.subscription_hash }}
          PROXY_HOST: ${{ inputs.proxy_host }}
          PROXY_PORT: ${{ inputs.proxy_port }}
        run: bash scripts/diagnose-socks-ssh.sh
