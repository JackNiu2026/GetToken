# Managed by GetToken SEO deployment. Only new SEO URL aliases are affected.
location ~ ^/(navigation|guides/[a-z0-9-]+)$ {
    absolute_redirect off;
    return 301 /$1/$is_args$args;
}
location ~ ^/(navigation|guides/[a-z0-9-]+)/index\.html$ {
    absolute_redirect off;
    # Directory index processing must keep serving content internally.
    if ($request_uri ~ "^/(navigation|guides/[a-z0-9-]+)/index\.html(?:\?.*)?$") {
        return 301 /$1/$is_args$args;
    }
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
