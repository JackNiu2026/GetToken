name: One-time admin password maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-password-reset.yml'
      - 'ops/admin-password-reset/**'
permissions:
  contents: read
jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gettoken-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare encrypted handoff or apply one-time reset
        env:
          DEPLOY_HOST: ${{ vars.GETTOKEN_HOST || '39.97.40.89' }}
          DEPLOY_USER: ${{ vars.GETTOKEN_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.GETTOKEN_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.GETTOKEN_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GETTOKEN_KNOWN_HOSTS }}
        run: bash ops/admin-password-reset/run.sh
