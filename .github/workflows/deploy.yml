name: Test and deploy GetToken

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and deployment scripts
        run: |
          for file in assets/gettoken/*.mjs scripts/*.mjs content/*.mjs; do node --check "$file"; done
          bash -n scripts/deploy-ssh.sh scripts/server-deploy.sh
          python3 -m py_compile scripts/configure-seo-routing.py scripts/inspect-live.py
      - name: Check generated static pages
        run: node scripts/build-site.mjs --check
      - name: Test catalog and static website
        run: node --test tests/*.test.mjs
      - name: Test domain configuration preservation and rollback
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package website
        run: node scripts/package-site.mjs
      - name: Verify packaged site with Nginx
        run: node scripts/test-nginx.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gettoken-${{ github.sha }}
          path: |
            site.tar.gz
            scripts/server-deploy.sh
            scripts/deploy-ssh.sh
            scripts/configure-seo-routing.py
            scripts/nginx-seo-locations.conf
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: gettoken-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: gettoken-${{ github.sha }}
      - name: Deploy and verify
        env:
          DEPLOY_HOST: ${{ vars.GETTOKEN_HOST || '39.97.40.89' }}
          DEPLOY_USER: ${{ vars.GETTOKEN_USER || 'root' }}
          DEPLOY_PORT: ${{ vars.GETTOKEN_PORT || '22' }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.GETTOKEN_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.GETTOKEN_KNOWN_HOSTS }}
        run: bash scripts/deploy-ssh.sh
      - name: Verify public production domain and deployed version
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: node scripts/check-live-seo.mjs --revision "$DEPLOY_REVISION" --output /tmp/gettoken-live-seo.json
