name: Read-only public deployment check
on:
  push:
    branches: [codex/live-deployment-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checker
        run: |
          npm install --prefix "$RUNNER_TEMP/gettoken-browser" playwright@1.62.1
          "$RUNNER_TEMP/gettoken-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check public deployment
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/gettoken-browser
        run: node scripts/check-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-check-report
          path: live-check.json
          retention-days: 3
