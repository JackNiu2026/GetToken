name: Inspect public SEO responses
on:
  push:
    branches: [seo/public-live-verification]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Report current public SEO behavior
        run: |
          node scripts/check-live-seo.mjs --output /tmp/gettoken-live-seo.json
